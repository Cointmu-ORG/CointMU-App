name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      # Skips the ~100MB Electron binary download and electron-builder's
      # install-app-deps; none of the steps below launch Electron and the
      # tree has no native modules to rebuild.
      - run: npm ci --ignore-scripts

      - run: npm run format:check

      - run: npm run typecheck

      - run: npm test

      - run: npm run i18n:audit

      - run: npm run build

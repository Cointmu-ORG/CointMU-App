name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # Its npm caching runs `npm config get cache` with Node's bundled
          # npm 11, which devEngines rejects.
          package-manager-cache: false

      # Same npm as Dependabot and local: package.json "packageManager".
      # Must run before any other npm command in the repo: Node 24 bundles
      # npm 11, which devEngines rejects, so setup-node's `cache: npm` (it
      # calls `npm config get cache` first) is replaced by actions/cache.
      - name: Use pinned npm
        id: npm
        run: |
          version=$(node -p "require('./package.json').packageManager.split('@')[1]")
          [ "$(npm -v)" = "$version" ] || npm install -g "npm@$version"
          echo "cache=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm.outputs.cache }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # Skips the ~100MB Electron binary download and electron-builder's
      # install-app-deps; none of the steps below launch Electron and the
      # tree has no native modules to rebuild.
      - run: npm ci --ignore-scripts

      - run: npm run format:check

      - run: npm run typecheck

      - run: npm test

      - run: npm run i18n:audit

      - run: npm run build

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # Its npm caching runs `npm config get cache` with Node's bundled
          # npm 11, which devEngines rejects.
          package-manager-cache: false

      # Same npm as Dependabot and local: package.json "packageManager".
      # Must run before any other npm command in the repo: Node 24 bundles
      # npm 11, which devEngines rejects, so setup-node's `cache: npm` (it
      # calls `npm config get cache` first) is replaced by actions/cache.
      - name: Use pinned npm
        id: npm
        run: |
          version=$(node -p "require('./package.json').packageManager.split('@')[1]")
          [ "$(npm -v)" = "$version" ] || npm install -g "npm@$version"
          echo "cache=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm.outputs.cache }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - run: npm ci --ignore-scripts

      # Non-blocking until the existing violations are paid down; the
      # summary tracks the count per rule.
      - name: oxlint
        continue-on-error: true
        run: npx --no oxlint -f json > oxlint.json

      - name: steiger
        continue-on-error: true
        run: npx --no steiger ./src/renderer/src --reporter json > steiger.json

      - name: Summary
        if: always()
        run: node scripts/lint-summary.js oxlint.json steiger.json >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # Its npm caching runs `npm config get cache` with Node's bundled
          # npm 11, which devEngines rejects.
          package-manager-cache: false

      # npm audit is subject to devEngines too.
      - name: Use pinned npm
        run: |
          version=$(node -p "require('./package.json').packageManager.split('@')[1]")
          [ "$(npm -v)" = "$version" ] || npm install -g "npm@$version"

      # Non-blocking: main still carries high-severity transitive advisories.
      # npm audit only reads package-lock.json, so no install is needed.
      - name: npm audit (high and above)
        continue-on-error: true
        run: |
          status=0
          npm audit --audit-level=high --json > audit.json || status=$?
          node scripts/audit-summary.js audit.json >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # TEMP(p5): the geth watcher on all three OS, under node and under Electron
  # in node mode (as the app runs it). Revert this job before merging.
  geth-watcher:
    name: geth-watcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Use pinned npm
        run: |
          version=$(node -p "require('./package.json').packageManager.split('@')[1]")
          [ "$(npm -v)" = "$version" ] || npm install -g "npm@$version"

      - run: npm ci --ignore-scripts

      - name: Download the Electron binary
        run: node node_modules/electron/install.js

      - name: Watcher under node
        run: npx --no vitest run src/main/geth/gethWatcher.test.ts

      - name: Watcher under Electron (ELECTRON_RUN_AS_NODE)
        run: GETH_WATCHER_RUNTIME="$(node -p 'require("electron")')" npx --no vitest run src/main/geth/gethWatcher.test.ts

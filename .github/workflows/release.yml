name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The three OS builds race to create the release when none exists, and
  # GitHub then holds two releases for one tag (as happened with v1.7.0).
  # Creating one draft first makes electron-builder upload into it.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Idempotent: a re-run finds the draft (or the published release) and
      # leaves it alone. The list endpoint, unlike /releases/tags, includes drafts.
      - name: Create draft release
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")] | length")
          if [ "$count" -gt 0 ]; then
            echo "Release for $GITHUB_REF_NAME already exists ($count), not creating another"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "${GITHUB_REF_NAME#v}" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    runs-on: ${{ matrix.os }}
    # electron-builder uploads the installers into the draft release.
    permissions:
      contents: write
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # Its npm caching runs `npm config get cache` with Node's bundled
          # npm 11, which devEngines rejects.
          package-manager-cache: false

      # Same npm as Dependabot and local: package.json "packageManager".
      # bash so the same script runs on the Windows runner. Must run before
      # any other npm command in the repo: Node 24 bundles npm 11, which
      # devEngines rejects, so setup-node's `cache: npm` (it calls
      # `npm config get cache` first) is replaced by actions/cache.
      - name: Use pinned npm
        id: npm
        shell: bash
        run: |
          version=$(node -p "require('./package.json').packageManager.split('@')[1]")
          [ "$(npm -v)" = "$version" ] || npm install -g "npm@$version"
          echo "cache=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm.outputs.cache }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libarchive-tools build-essential fakeroot rpm libfuse2

      - name: Install Dependencies
        run: npm ci

      # geth-supervisor.exe runs geth on Windows so it stops cleanly (#97);
      # an installer without it would hard-kill geth on every stop.
      - name: Setup Go (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/geth-supervisor/go.mod
          cache: false

      - name: Build geth-supervisor (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm run build:geth-supervisor
          test -s resources/bin/win/geth-supervisor.exe

      - name: Build and Publish Artifacts
        run: npm run build && npx electron-builder --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only MAIN_VITE_* reaches the app (baked in by electron-vite).
          # The enode is public, so a repository variable; empty uses the
          # built-in bootnode.
          MAIN_VITE_BOOTNODE_ENODE: ${{ vars.BOOTNODE_ENODE }}
          # Not secret (the DSN key is public, the pin is a public-key hash),
          # so repository variables; empty disables error reporting.
          MAIN_VITE_TELEMETRY_DSN: ${{ vars.TELEMETRY_DSN }}
          MAIN_VITE_TELEMETRY_PINS: ${{ vars.TELEMETRY_PINS }}

  # electron-builder never edits the draft's body, so filling it after
  # every OS build has finished cannot be overwritten. Publishing only now
  # keeps the auto-updater from seeing a release with missing installers.
  release-notes:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # Its npm caching runs `npm config get cache` with Node's bundled
          # npm 11, which devEngines rejects.
          package-manager-cache: false

      - name: Generate release notes
        run: node scripts/release-notes.js "$GITHUB_REF_NAME" > release-notes.md

      # Publishing an incomplete or duplicated release breaks the auto-updater,
      # so stop here instead.
      - name: Check release assets
        run: |
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")]")
          count=$(jq length <<<"$releases")
          if [ "$count" -ne 1 ]; then
            echo "::error::$count releases for $GITHUB_REF_NAME, expected exactly 1"
            exit 1
          fi
          assets=$(jq '.[0].assets | length' <<<"$releases")
          if [ "$assets" -lt "$EXPECTED_ASSETS" ]; then
            echo "::error::Release $GITHUB_REF_NAME has $assets assets, expected $EXPECTED_ASSETS:"
            jq -r '.[0].assets[].name' <<<"$releases"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # latest.yml, latest-linux.yml, latest-mac.yml; Windows exe +
          # blockmap; Linux AppImage + deb; macOS dmg + zip, each + blockmap.
          EXPECTED_ASSETS: 11

      - name: Publish release with notes
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # electron-builder creates the release and uploads the installers.
    permissions:
      contents: write
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # Its npm caching runs `npm config get cache` with Node's bundled
          # npm 11, which devEngines rejects.
          package-manager-cache: false

      # Same npm as Dependabot and local: package.json "packageManager".
      # bash so the same script runs on the Windows runner. Must run before
      # any other npm command in the repo: Node 24 bundles npm 11, which
      # devEngines rejects, so setup-node's `cache: npm` (it calls
      # `npm config get cache` first) is replaced by actions/cache.
      - name: Use pinned npm
        id: npm
        shell: bash
        run: |
          version=$(node -p "require('./package.json').packageManager.split('@')[1]")
          [ "$(npm -v)" = "$version" ] || npm install -g "npm@$version"
          echo "cache=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm.outputs.cache }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libarchive-tools build-essential fakeroot rpm libfuse2

      - name: Install Dependencies
        run: npm ci

      - name: Build and Publish Artifacts
        run: npm run build && npx electron-builder --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only MAIN_VITE_* reaches the app (baked in by electron-vite).
          # The enode is public, so a repository variable; empty uses the
          # built-in bootnode.
          MAIN_VITE_BOOTNODE_ENODE: ${{ vars.BOOTNODE_ENODE }}
          # Not secret (the DSN key is public, the pin is a public-key hash),
          # so repository variables; empty disables error reporting.
          MAIN_VITE_TELEMETRY_DSN: ${{ vars.TELEMETRY_DSN }}
          MAIN_VITE_TELEMETRY_PINS: ${{ vars.TELEMETRY_PINS }}

  # electron-builder creates a published release with an empty body and
  # never edits the body afterwards, so filling it after every OS build
  # has finished cannot be overwritten. The release title is left as is.
  release-notes:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # Its npm caching runs `npm config get cache` with Node's bundled
          # npm 11, which devEngines rejects.
          package-manager-cache: false

      - name: Generate release notes
        run: node scripts/release-notes.js "$GITHUB_REF_NAME" > release-notes.md

      - name: Update release body
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

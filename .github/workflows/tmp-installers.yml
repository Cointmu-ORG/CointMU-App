# TEMP(fix/macos-resources-offline-launch): builds the release installers on
# all three OS without publishing and inspects the packaged geth and
# extension.zip, to verify PR #60 before merge. Revert this commit before
# merging.
name: TEMP installers

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Use pinned npm
        id: npm
        shell: bash
        run: |
          version=$(node -p "require('./package.json').packageManager.split('@')[1]")
          [ "$(npm -v)" = "$version" ] || npm install -g "npm@$version"
          echo "cache=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm.outputs.cache }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libarchive-tools build-essential fakeroot rpm libfuse2

      - name: Install Dependencies
        run: npm ci

      # A PowerPC Mach-O gets the same EBADARCH ("Bad CPU type") an x86_64
      # geth gets on Apple Silicon without Rosetta; the ELF geth gets ENOEXEC.
      - name: Probe spawn errors (macOS)
        if: runner.os == 'macOS'
        run: |
          cat > spawn-probe.ts <<'EOF'
          import { spawn } from "node:child_process";
          import { chmodSync, writeFileSync } from "node:fs";
          import { classifySpawnError } from "./src/main/geth/gethSpawnError";

          const ppc = Buffer.alloc(4096);
          ppc.writeUInt32LE(0xfeedface, 0); // MH_MAGIC
          ppc.writeInt32LE(18, 4); // CPU_TYPE_POWERPC
          ppc.writeUInt32LE(2, 12); // MH_EXECUTE
          writeFileSync("ppc-macho", ppc);
          chmodSync("ppc-macho", 0o755);

          for (const file of ["./ppc-macho", "resources/bin/linux/geth", "resources/bin/mac/geth"]) {
            const report = (how: string, err: NodeJS.ErrnoException) =>
              console.log(file, how, err.code, err.errno, classifySpawnError(err, process.platform));
            try {
              const child = spawn(file, ["version"], { stdio: "ignore" });
              child.on("spawn", () => console.log(file, "spawned"));
              child.on("error", (err) => report("async", err));
            } catch (err) {
              report("sync", err as NodeJS.ErrnoException);
            }
          }
          EOF
          uname -m
          npx --no -- tsx spawn-probe.ts

      # Same command as release.yml, minus publishing.
      - name: Build Artifacts
        run: npm run build && npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          MAIN_VITE_BOOTNODE_ENODE: ${{ vars.BOOTNODE_ENODE }}

      - name: Inspect DMG and zip (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eux
          hdiutil attach dist/*.dmg -mountpoint /tmp/dmg -nobrowse -readonly
          res=/tmp/dmg/CointMU.app/Contents/Resources
          ls -l "$res/bin/mac/geth" "$res/extension.zip"
          file "$res/bin/mac/geth"
          test -x "$res/bin/mac/geth"
          hdiutil detach /tmp/dmg
          unzip -Z dist/*.zip | grep -E 'Contents/Resources/(bin/mac/geth|extension\.zip)$'

      - name: Inspect NSIS installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eux
          7z x -y -o/tmp/nsis dist/*.exe '$PLUGINSDIR/app-64.7z'
          7z l /tmp/nsis/'$PLUGINSDIR'/app-64.7z | grep -E 'resources\\(extension\.zip|bin\\win\\geth\.exe)$'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 3

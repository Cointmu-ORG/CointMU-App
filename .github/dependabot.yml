version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # @sentry/electron pins an exact @sentry/core. Bumping core on its own
      # installs a second copy with incompatible types and breaks typecheck.
      # Bump it by hand, to the version the new @sentry/electron pins, in the
      # PR that bumps @sentry/electron.
      - dependency-name: '@sentry/core'
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # CodeQL refuses to run when init and analyze are on different versions,
      # so they have to be bumped in the same PR.
      codeql-action:
        patterns:
          - 'github/codeql-action/*'
